[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/wgpu-sampler/wgpu", "vendor/wgpu-sampler/wgpu-core", "vendor/wgpu-sampler/wgpu-hal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tikv-jemallocator = "0.6"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rayon = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
unbound-compat = { path = "crates/unbound-compat" }
unbound-yaml = { path = "crates/unbound-yaml" }
unbound-project = { path = "crates/unbound-project" }
unbound-cache = { path = "crates/unbound-cache" }
unbound-assets = { path = "crates/unbound-assets" }
unbound-host = { path = "crates/unbound-host" }
unbound-runtime = { path = "crates/unbound-runtime" }
unbound-scene = { path = "crates/unbound-scene" }
unbound-app = { path = "crates/unbound-app" }
unbound-shaders = { path = "crates/unbound-shaders" }
unbound-remote = { path = "crates/unbound-remote" }
unbound-gi = { path = "crates/unbound-gi" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"

# Native sampler LOD bias, retaining the pinned backend ownership and cache.
[patch.crates-io]
wgpu = { path = "vendor/wgpu-sampler/wgpu" }
wgpu-core = { path = "vendor/wgpu-sampler/wgpu-core" }
wgpu-hal = { path = "vendor/wgpu-sampler/wgpu-hal" }
