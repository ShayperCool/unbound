[package]
name = "unbound-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustc-hash = "2"
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
unbound-runtime.workspace = true
unbound-compat.workspace = true
unbound-gi.workspace = true
unbound-shaders.workspace = true
unbound-remote.workspace = true
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "x11",
    "wayland",
] }
# Custom cursor images (Cursor.SetCursor), without the picking crate bevy's own feature pulls in.
bevy_window = { version = "0.20", default-features = false, features = ["custom_cursor"] }
bevy_winit = { version = "0.20", default-features = false, features = ["custom_cursor"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
image = { version = "0.25", default-features = false, features = ["png"] }
unbound-assets.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
# Native plugins' OpenGL context sharing the renderer's Vulkan memory (render/gl_interop.rs).
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles"] }
ash = "0.38"
# EGL of wgpu's OpenGL backend (its contexts and displays).
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
# Load libwayland-client when a Wayland session needs it instead of linking it, so the binary
# also starts on X11-only and headless systems that lack the library (only adds a feature to
# bevy's winit).
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Metal device's plugin interface (render/executor/plugins_metal.rs): the renderer's own
# Metal objects, as wgpu's Metal backend has them.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSGeometry", "NSRange", "NSString"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
tracing-subscriber.workspace = true
