[package]
name = "unbound-assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
blake3.workspace = true
crc32fast = "1"
serde.workspace = true
tracing.workspace = true
unbound-yaml.workspace = true
# Textures
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "gif", "tiff", "hdr", "exr", "rayon"] }
# EXR layouts the image crate does not read (single-channel, luminance).
exr = "1"
psd = "0.3"
fast_image_resize = "6"
# Audio
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "ogg", "vorbis", "flac", "aiff"] }
# Models
ufbx = "0.11"
# The IDs Unity derives for imported objects its meta does not list (xxHash64).
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
# Tangents of imported meshes ("Calculate Tangent Space": MikkTSpace, as Unity).
bevy_mikktspace = "1"
# Fonts
ttf-parser = "0.25"
ab_glyph_rasterizer = "0.1"
# Cache
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde_bytes = "0.11"
lz4_flex = "0.14"
rayon.workspace = true
# AssetBundles: LZMA blocks, block-compressed (BC, ETC, ASTC) textures of player data.
lzma-rs = "0.3"
texture2ddecoder = "0.1"
# BC7 compression of imported textures for the GPU (Intel ISPC kernels).
intel_tex_2 = "0.5"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[dev-dependencies]
serde_json.workspace = true
rayon.workspace = true
walkdir.workspace = true
